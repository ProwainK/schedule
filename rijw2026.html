<script>

  // 顯示 loading
  const loadingEl = document.getElementById('loadingOverlay');
  if (loadingEl) loadingEl.style.display = 'flex'; // 顯示載入畫面

  let allRuns = [];
  let embla, thumbEmbla;

  let gameDB = {};

async function init() {

  //const loadingEl = document.getElementById('loadingOverlay');
  //if (loadingEl) loadingEl.style.display = 'flex'; // 顯示載入畫面



  // 在 JS 裡用 fetch() 載入 JSON
  // let gameDB = {};
  // let renameDB = {};
  // let rijJSON = {};
  try {
    // 陣列讀取寫法，但先略過不用
    /*const [gameRes, renameRes, rijRes] = await Promise.all([
      fetch('https://yourdomain.com/path/to/gameDB.json'),
      fetch('https://yourdomain.com/path/to/renameDB.json'),
      fetch('https://yourdomain.com/path/to/rijw2025.json')
    ]);*/
    const gameDBRes = await fetch('./DB/RiJW2026-game.json');

    gameDB = await gameDBRes.json();
    //renameDB = await renameRes.json();
    //rijJSON = await rijRes.json();

    //console.log("✅ 資料載入成功", { gameDB, renameDB, rijJSON });
    console.log("✅ 資料載入成功", { gameDB });

  } catch (e) {
    console.error("❌ 載入 JSON 失敗：", e);
  }



  try {
    const res = await fetch('./DB/RiJW2026-schedule.json');
    if (!res.ok) {
      throw new Error(`賽程 JSON 載入失敗：HTTP ${res.status}`);
    }

    const data = await res.json();
    console.log("📦 RiJW2026-schedule.json 頂層欄位：", Object.keys(data ?? {}));

    // 支援舊版 GitHub Actions 格式，以及官方 RTA JSON 的 runs 格式。
    let sourceRuns = [];
    let isLegacyItems = false;

    if (Array.isArray(data?.data?.items)) {
      sourceRuns = data.data.items;
      isLegacyItems = true;
    } else if (Array.isArray(data?.runs)) {
      sourceRuns = data.runs;
    } else if (Array.isArray(data?.results)) {
      sourceRuns = data.results;
    } else if (Array.isArray(data?.items)) {
      sourceRuns = data.items;
    } else if (Array.isArray(data?.data)) {
      sourceRuns = data.data;
    }

    if (!sourceRuns.length) {
      throw new Error(
        `找不到可用的賽程陣列。頂層欄位：${Object.keys(data ?? {}).join(', ')}`
      );
    }

    const durationToSeconds = value => {
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      if (typeof value !== 'string') return 0;

      // ISO 8601 duration，例如 PT1H05M 或 PT90M
      const match = value.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
      if (match) {
        return Number(match[1] || 0) * 3600 +
               Number(match[2] || 0) * 60 +
               Number(match[3] || 0);
      }

      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : 0;
    };

    const eventStartValue =
      data?.event?.startsAt ??
      data?.event?.startTime ??
      data?.startsAt ??
      data?.startTime ??
      null;

    let nextCalculatedStart = eventStartValue ? new Date(eventStartValue) : null;

    allRuns = sourceRuns.map(item => {
      let name, category, runners, consoleName, startValue, estimate, setupSeconds, type;

      if (isLegacyItems) {
        // 舊版 GitHub Actions 資料：欄位放在 item.data 的索引中
        name = item?.data?.[0];
        category = item?.data?.[1];
        consoleName = item?.data?.[3];
        runners = item?.data?.[4];
        startValue = item?.scheduled;
        estimate = item?.length;
        setupSeconds = 0;
        type = 'speedrun';
      } else {
        name = item?.name ?? item?.game?.name ?? item?.game;
        category = item?.category;
        runners = item?.runners;
        consoleName = item?.console ?? item?.platform;
        startValue =
          item?.scheduled ??
          item?.scheduledAt ??
          item?.starttime ??
          item?.startTime ??
          item?.startsAt ??
          null;
        estimate =
          item?.run_time ??
          item?.length ??
          item?.estimateSeconds ??
          item?.estimate ??
          null;
        setupSeconds = Number(item?.setupSeconds ?? 0);
        type = item?.type ?? item?.runType ?? 'speedrun';
      }

      let start;
      if (startValue) {
        start = new Date(startValue);
      } else if (nextCalculatedStart && !Number.isNaN(nextCalculatedStart.getTime())) {
        start = new Date(nextCalculatedStart);
      } else {
        start = new Date(NaN);
      }

      // 若來源沒有每場的固定時間，從活動起始時間依預估時長及設定時間推算。
      if (!Number.isNaN(start.getTime())) {
        nextCalculatedStart = new Date(
          start.getTime() +
          durationToSeconds(estimate) * 1000 +
          Math.max(0, setupSeconds) * 1000
        );
      }

      const runnerText = Array.isArray(runners)
        ? runners.map(runner =>
            typeof runner === 'string' ? runner : (runner?.name ?? '')
          ).filter(Boolean).join(', ')
        : (runners ?? '');

      return {
        game: typeof name === 'string' ? name : (name?.name ?? ''),
        category: category ?? '',
        runners: runnerText,
        start,
        estimate,
        console: consoleName ?? '',
        type
      };
    }).filter(run =>
      (run.type === 'speedrun' || run.game) &&
      run.game &&
      !Number.isNaN(run.start.getTime())
    );

    if (!allRuns.length) {
      throw new Error(
        '已讀取 JSON，但無法產生有效賽程。請確認每場賽事有遊戲名稱及開始時間，或資料包含 event.startsAt。'
      );
    }

    console.log(`✅ 賽程正規化完成：${allRuns.length} 場`);


    createDayButtons(); // 建立上方的日期選單

    // =============== ✅ 自動偵測目前時間的節目 ===============

    const taipeiOffset = 8 * 60 * 60 * 1000; // 台北時區偏移（毫秒），目前沒用到但保留
    const now = Date.now(); // 取得當前時間的 UTC 毫秒數

    const currentRun = (() => {
      if (!allRuns.length) return null; // 沒有節目直接回 null

      // 先過濾出有開始時間的節目，並以開始時間正序排序
      const sorted = allRuns
        .filter(r => r.start)
        .sort((a, b) => a.start - b.start);

      // 取最後一個節目的開始時間（毫秒）
      if (!sorted.length) return null;

      const lastRunStart = sorted[sorted.length - 1].start.getTime();

      // 如果現在時間已超過最後節目開始時間一小時(3600000毫秒)，表示沒節目進行中
      if (now > lastRunStart + 3600000) return null;

      // 從最新的節目開始往前找，找到第一個開始時間小於等於現在的節目
      // 找不到的話回傳 null
      return [...sorted].reverse().find(r => now >= r.start.getTime()) || null;
    })();

    console.log("正在直播:");
    console.log(currentRun);

    // 預設顯示第一天（若沒有節目進行中）
    let dateStrToShow = getUniqueDates()[0];

    // 若有節目正在進行，顯示該節目的日期
    if (currentRun) {
      const fmt = new Intl.DateTimeFormat("sv-SE", {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      });
      dateStrToShow = fmt.format(currentRun.start).replace(/-/g, '');
    }

    // 執行顯示指定日期的節目清單
    if (dateStrToShow) {
      await filterAndRender(dateStrToShow);

      // 自動將對應的日期按鈕標記為 active
      const dayButtons = document.querySelectorAll('.day-button');
      [...dayButtons].forEach(btn => {
        if (btn.textContent.replace(/\D/g, '') === dateStrToShow.slice(4)) {
          btn.classList.add('active');
        }
      });

      // 如果有進行中的項目，自動切換到對應的主輪播 slide
      if (currentRun) {
        const fmt = new Intl.DateTimeFormat("sv-SE", {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
        });
        const targetDay = fmt.format(currentRun.start).replace(/-/g, '');
        const filteredRuns = allRuns.filter(run =>
          fmt.format(run.start).replace(/-/g, '') === targetDay
        );
        const targetIndex = filteredRuns.findIndex(r => r === currentRun);
        if (typeof embla?.scrollTo === 'function') {
          setTimeout(() => {
            embla.scrollTo(targetIndex); // 自動切到那一場節目的頁面
          }, 300); // 稍微等 Embla 初始化
        }
      }
    }
    // =========================================================

  } catch (e) {
    // 整體流程錯誤，顯示錯誤訊息
    if (loadingEl) { loadingEl.textContent = '賽程載入失敗，請查看 Console 診斷訊息。'; }
    console.error(e);
  } finally {
    // 不論成功與否，都移除 loading 畫面
    if (loadingEl) loadingEl.style.display = 'none';
  }
}


// EST Time 預計長度格式轉換 (PT1H05M → 1 小時 5 分鐘)
function formatISODuration(duration) {
  if (duration == null || duration === '') return '';

  let totalSeconds;
  if (typeof duration === 'number' && Number.isFinite(duration)) {
    totalSeconds = Math.max(0, Math.floor(duration));
  } else if (typeof duration === 'string') {
    const match = duration.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
    if (!match) return duration;

    totalSeconds =
      parseInt(match[1] || '0', 10) * 3600 +
      parseInt(match[2] || '0', 10) * 60 +
      parseInt(match[3] || '0', 10);
  } else {
    return '';
  }

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  const parts = [];
  if (hours > 0) parts.push(`${hours} 小時`);
  if (minutes > 0) parts.push(`${minutes} 分鐘`);
  if (seconds > 0 && hours === 0) parts.push(`${seconds} 秒`);
  return parts.join(' ') || '0 分鐘';
}


  function getUniqueDates() {
    const fmt = new Intl.DateTimeFormat("sv-SE", {
      timeZone: 'Asia/Taipei',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    });
    return [...new Set(allRuns.map(run => fmt.format(run.start).replace(/-/g, '')))].sort();
  }

  function createDayButtons() {
    const container = document.getElementById('daySelector');
    if (!container) { console.error('找不到日期選單容器 #daySelector'); return; }
    container.innerHTML = '';
    const labelFmt = new Intl.DateTimeFormat("zh-TW", {
      timeZone: 'Asia/Taipei',
      month: '2-digit',
      day: '2-digit',
      weekday: 'short'
    });

    getUniqueDates().forEach(dateStr => {
      // yyyyMMdd
      const y = dateStr.slice(0,4);
      const m = dateStr.slice(4,6);
      const d = dateStr.slice(6,8);
      const localDate = new Date(`${y}-${m}-${d}T00:00:00`);

      const btn = document.createElement('button');
      btn.className = 'day-button';
      // btn.textContent = labelFmt.format(localDate);
      // let text = labelFmt.format(localDate).replace(/[（）]/g, ' ').trim(); // "07/07 週一"

if (window.innerHeight > window.innerWidth) {
  // 直式：07/07
  text = `${m}/${d}`;
} else {
  // 橫式：07/07 週一
  text = labelFmt.format(localDate).replace(/[（）]/g, ' ').trim();
}

      btn.textContent = text;
      btn.onclick = () => {
        document.querySelectorAll('.day-button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterAndRender(dateStr);
      };
      container.appendChild(btn);
    });
  }

  async function filterAndRender(dateStr) {
    const scheduleList = document.getElementById('scheduleList');
    const thumbnailContainer = document.getElementById('thumbnailContainer');


  const emblaEl = document.getElementById('embla');
  const thumbListEl = document.getElementById('thumbnailList');



  // 先移除 fade-in，確保動畫正確觸發
  emblaEl.classList.remove('fade-in');
  thumbListEl.classList.remove('fade-in');

  // 加 fade-out 淡出
  emblaEl.classList.add('fade-out');
  thumbListEl.classList.add('fade-out');

  // 強制重繪，觸發 transition
  emblaEl.offsetHeight;
  thumbListEl.offsetHeight;

  // 等 500ms (動畫時間) 再換內容
  await new Promise(resolve => setTimeout(resolve, 600));





    scheduleList.innerHTML = '';
    thumbnailContainer.innerHTML = '';

    if (embla) embla.destroy();
    if (thumbEmbla) thumbEmbla.destroy();

    const fmt = new Intl.DateTimeFormat("sv-SE", {
      timeZone: 'Asia/Taipei',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    });

    const filtered = allRuns.filter(run =>
      fmt.format(run.start).replace(/-/g, '') === dateStr
    );

    if (filtered.length === 0) {
      scheduleList.innerHTML = '<div class="embla__slide" style="color:#f00; font-size:1.5rem; padding:1rem;">該日無賽程</div>';
      return;
    }

    filtered.forEach((item, i) => {

      // renameDB 已廢除
      //item.game = window.renameDB[item.game] || item.game;

      // console.log(item.game);
      //const info = window.gameDB[item.game] || {};
      const info = gameDB[item.game] || {};
      const details = (info.RiJW2026 && info.RiJW2026[item.category]) || (info.RiJW2025 && info.RiJW2025[item.category]) || [null, null];

      // 主輪播 slide
      const slide = document.createElement('div');
      slide.className = 'embla__slide';
      slide.innerHTML = `
        <div class="left-side">
          <img class="game-boxart" src="${info.boxart || 'https://static-cdn.jtvnw.net/ttv-static/404_boxart-600x800.jpg' || ''}" alt="${item.game}" />
        </div>
        <div class="right-side">
          <h2>${info.tw || info.jp || info.en || item.game}</h2>
          <h3>${info.jp || ''}</h3>
          <h3>${info.en || ''}</h3>
          ${details[0] ? `<p class="category-tw">${details[0]}</p><p>${item.category}</p>` : `<p class="category-tw">${item.category}</p>`}
<p>
  <strong>預定開跑：</strong>
  ${item.start.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hourCycle: 'h23', hour: '2-digit', minute: '2-digit' })}
  　<strong>預計長度：</strong>
  ${formatISODuration(item.estimate)}
  　<strong>主機平台：</strong>
  ${item.console}
</p>
          <p><strong>跑者：</strong>${item.runners}</p>
          ${details[1] ? `<p class="details">${details[1]}</p>` : ''}
        </div>
      `;
      scheduleList.appendChild(slide);

      // 縮圖 slide
      const thumbSlide = document.createElement('div');
      thumbSlide.className = 'embla__slide';
      const thumbImg = document.createElement('img');
      thumbImg.className = 'thumbnail';
      thumbImg.src = info.boxart || 'https://static-cdn.jtvnw.net/ttv-static/404_boxart-600x800.jpg' || '';
      thumbImg.alt = `${item.game} 縮圖`;
      thumbImg.dataset.index = i;
      thumbSlide.appendChild(thumbImg);
      thumbnailContainer.appendChild(thumbSlide);
    });

    // 初始化 Embla 主輪播
    embla = EmblaCarousel(document.getElementById('embla'), {
      loop: false,
      align: 'start',
      draggable: true,
      dragFree: true,
      speed: 10 },
      [ EmblaCarouselWheelGestures({ forceWheelAxis: 'y' }) ]
    );

    // 初始化 Embla 縮圖輪播
    thumbEmbla = EmblaCarousel(document.getElementById('thumbnailList'), {
      containScroll: 'trimSnaps',
      dragFree: true,
      axis: 'x' },
      [ EmblaCarouselWheelGestures({ forceWheelAxis: 'y' }) ]
    );

    function selectThumbnail(index) {
      document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
        thumb.classList.toggle('is-selected', i === index);
      });
    }

    // 主輪播切換時，同步選中縮圖並滾動縮圖輪播
    embla.on('select', () => {
  const index = embla.selectedScrollSnap();

  // 移除所有縮圖上的選擇狀態
  document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('is-selected'));

  // 加上當前的縮圖選擇狀態
  const selectedThumb = document.querySelector(`.thumbnail[data-index="${index}"]`);
  if (selectedThumb) {
    selectedThumb.classList.add('is-selected');
    
    // 捲動到畫面中央，而不是只靠滑入
    selectedThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
    });

    // 縮圖點擊跳轉主輪播
    document.querySelectorAll('.thumbnail').forEach(thumb => {
      thumb.addEventListener('click', () => {
        const index = Number(thumb.dataset.index);
        embla.scrollTo(index);
      });
    });



  // 淡入
  emblaEl.classList.remove('fade-out');
  emblaEl.classList.add('fade-in');
  thumbListEl.classList.remove('fade-out');
  thumbListEl.classList.add('fade-in');





    // 預設選中第一張
    embla.emit('select');
  }

  init();


window.addEventListener('resize', () => {
  const currentActive = document.querySelector('.day-button.active');
  const selectedDateStr = currentActive?.textContent?.replace(/\D/g, '');

  if (allRuns.length && document.getElementById('daySelector')) createDayButtons();

  // 保留使用者目前選擇的日期按鈕
  const buttons = document.querySelectorAll('.day-button');
  const firstButton = buttons[0];
  if (selectedDateStr && buttons.length > 0) {
    const match = [...buttons].find(btn => btn.textContent.replace(/\D/g, '') === selectedDateStr);
    if (match) {
      match.classList.add('active');
    } else {
      firstButton?.classList.add('active');
    }
  }

});


function setRealVH() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
}
setRealVH();
window.addEventListener('resize', setRealVH);

</script>
